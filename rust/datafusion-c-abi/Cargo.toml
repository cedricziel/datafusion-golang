[package]
name = "datafusion-c-abi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
arrow = { version = "59.2.0", features = ["ffi"] }
async-trait = "0.1"
base64 = "0.23"
datafusion = "54.1.0"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[dev-dependencies]
